# yaml-language-server: $schema=https://raw.githubusercontent.com/SENERGY-Platform/mgw-modfile-lib/main/schema/v1.json
modfileVersion: "v1"
id: github.com/SENERGY-Platform/mgw-syrlex-module
name: SyrLex
description: "Emulates the SYR Connect cloud for SYR LEX Plus water softeners and makes them available via MQTT. Needs a local DNS server that resolves the SYR Connect hostnames to the gateway."
version: v0.1.0
type: device-connector
deploymentType: single
license: "Apache License 2.0"
dependencies:
  github.com/SENERGY-Platform/mgw-mqtt-broker:
    version: <v2.0.0
    requiredServices:
      broker:
        - refVar: MQTT_SERVER
          template: "tcp://{ref}:1881"
          services:
            - syrlex2mqtt
  github.com/SENERGY-Platform/mgw-sni-router-module:
    version: <v2.0.0
    requiredServices:
      sni-router:
        - refVar: SNI_ROUTER_URL
          template: "http://{ref}:8080"
          services:
            - syrlex2mqtt
services:
  syrlex2mqtt:
    name: syrlex2mqtt
    image: ghcr.io/senergy-platform/syrlex2mqtt:v0.1.0
configs:
  MQTT_USER:
    value: " "
    targets:
      - refVar: MQTT_USER
        services:
          - syrlex2mqtt
  MQTT_PASSWORD:
    value: " "
    targets:
      - refVar: MQTT_PASSWORD
        services:
          - syrlex2mqtt
  ADDITIONAL_PROPERTIES:
    value: "PRS"
    targets:
      - refVar: ADDITIONAL_PROPERTIES
        services:
          - syrlex2mqtt
  VERBOSE_LOGGING:
    dataType: string
    value: "false"
    optionsExt: false
    options:
      - "true"
      - "false"
    userInput:
      name: Debug Logging
      type: text        
    targets:
      - refVar: VERBOSE_LOGGING
        services:
          - syrlex2mqtt