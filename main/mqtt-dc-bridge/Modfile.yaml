  mgwMqttClientId:
    dataType: string
    value: "mgw-mqtt-dc"
    targets:
      - refVar: MGW_MQTT_CLIENT_ID
        services:
          - mgw-mqtt-dc
    userInput:
      type: text
      name: MGW MQTT Client ID
      group: mqtt
  errorDeduplicationPeriod:
    dataType: string
    value: "1h"
    targets:
      - refVar: ERROR_DEDUPLICATION_PERIOD
        services:
          - mgw-mqtt-dc
    userInput:
      type: text
      name: Error Deduplication Period
      description: "An error message is forwarded to the MGW only if the same message has not been sent within this period, e.g. 1h. '-' disables the deduplication."
      group: mqtt
  generatorUse:
    dataType: string
    value: "true"
    targets:
      - refVar: GENERATOR_USE
        services:
          - mgw-mqtt-dc
  generatorFilterDevicesByAttribute:
    dataType: string
    optional: true
    targets:
      - refVar: GENERATOR_FILTER_DEVICES_BY_ATTRIBUTE
        services:
          - mgw-mqtt-dc
    userInput:
      type: text
      name: Generator Device Filter
      description: "Value of the device attribute 'senergy/local-mqtt' for which this MGW generates topics. Empty uses all devices of the account. Must be set if the account has more than one MGW with this module."
      group: mqtt
  activateDevicesOnEvent:
    dataType: string
    value: "false"
    options:
      - "true"
      - "false"
    optionsExt: false
    targets:
      - refVar: ACTIVATE_DEVICES_ON_EVENT
        services:
          - mgw-mqtt-dc
    userInput:
      type: text
      name: Activate Devices on Event
      description: "If true, a device with event topics is added to the hub only after its first event on the remote broker. Use this if the account has more than one MGW with this module and the devices of each MGW are recognizable by their messages."
      group: remote-mqtt
  activatedDevicesFile:
    dataType: string
    value: "/root/data/activated_devices.json"
    targets:
      - refVar: ACTIVATED_DEVICES_FILE
        services:
          - mgw-mqtt-dc
  debug:
    dataType: string
    value: "false"
    options:
      - "true"
      - "false"
    optionsExt: false
    targets:
      - refVar: DEBUG
        services:
          - mgw-mqtt-dc
    userInput:
      type: text
      name: DEBUG
inputGroups: 
  mqtt:
    name: "MGW MQTT"
  remote-mqtt:
    name: "Remote MQTT"