modfileVersion: "v1"
id: github.com/SENERGY-Platform/mgw-process-module
name: Process Module
description: "Runs processes deployed from the cloud on the gateway with the automation-engine (MODE=fog, SQLite)."
version: v2.0.0
type: add-on
deploymentType: single
license: "Apache License 2.0"
services:
  automation-engine:
    name: automation-engine
    image: ghcr.io/senergy-platform/automation-engine:v0.1.5
    requiredServices:
      - process-io-db
  # Postgres of process-io-worker from v1.x, kept for this version only: the engine takes its
  # values over once on the first start (LEGACY_IO_POSTGRES). The next version removes it.
  process-io-db:
    name: process-io-db
    image: postgres:11.2
dependencies:
  github.com/SENERGY-Platform/mgw-device-repository-mirror-module:
    version: "<v2.0.0"
    requiredServices:
      device-repo-mirror:
        - refVar: DEVICE_REPOSITORY_URL
          template: "http://{ref}:8080"
          services:
            - automation-engine
  github.com/SENERGY-Platform/mgw-cloud-proxy/mgw-module:
    version: "<v1.0.0"
    requiredServices:
      gateway:
        - refVar: NOTIFIER_URL
          template: "http://{ref}/notifications-v2"
          services:
            - automation-engine
  github.com/SENERGY-Platform/mgw-mqtt-broker:
    version: <v2.0.0
    requiredServices:
      broker:
        - refVar: MQTT_BROKER
          template: "tcp://{ref}:1881"
          services:
            - automation-engine
  github.com/SENERGY-Platform/mgw-last-value-module:
    version: <v2.0.0
    requiredServices:
      mgw-last-value:
        - refVar: LAST_VALUE_URL
          template: "http://{ref}:8080"
          services:
            - automation-engine
serviceReferences:
  process-io-db:
    - refVar: LEGACY_IO_POSTGRES
      template: "postgres://processio:processio@{ref}:5432/processio?sslmode=disable"
      services:
        - automation-engine
volumes:
  automationEngineData:
    - mountPoint: /root/data
      services:
        - automation-engine
  processIoDbData:
    - mountPoint: /var/lib/postgresql/data
      services:
        - process-io-db
configs:
  engineMode:
    dataType: string
    value: "fog"
    targets:
      - refVar: MODE
        services:
          - automation-engine
  engineDatabase:
    dataType: string
    value: "sqlite"
    targets:
      - refVar: DATABASE
        services:
          - automation-engine
  engineSqlitePath:
    dataType: string
    value: "/root/data/automation-engine.db"
    targets:
      - refVar: SQLITE_PATH
        services:
          - automation-engine
  engineMqttClientId:
    dataType: string
    value: "mgw-automation-engine"
    targets:
      - refVar: MQTT_CLIENT_ID
        services:
          - automation-engine
    userInput:
      type: text
      name: MQTT Client ID
      description: client id on the broker of the gateway; must not be used by another client of that broker
  engineStorageBudget:
    dataType: int
    value: 0
    targets:
      - refVar: STORAGE_BUDGET
        services:
          - automation-engine
    userInput:
      type: number
      description: upper bound of the database in bytes; 0 uses the default of 1 GiB, a negative value is unlimited
      name: Storage Budget
    optional: true
  timezone:
    dataType: string
    value: "Europe/Berlin"
    targets:
      - refVar: TIMEZONE
        services:
          - automation-engine
    userInput:
      type: text
      name: Location / Timezone
  legacyIoOwner:
    dataType: string
    targets:
      - refVar: LEGACY_IO_OWNER
        services:
          - automation-engine
    userInput:
      type: text
      name: Owner of migrated process-io values
      description: user id of the owner of the gateway; the process-io values of the process module v1 are taken over once for this user on the first start
    optional: true
  logLevel:
    dataType: string
    value: "info"
    options:
      - "debug"
      - "info"
      - "warn"
      - "error"
    optionsExt: false
    targets:
      - refVar: LOG_LEVEL
        services:
          - automation-engine
    userInput:
      type: text
      name: Log level
    optional: true
  processIoDbName:
    dataType: string
    value: "processio"
    targets:
      - refVar: POSTGRES_DB
        services:
          - process-io-db
  processIoDbUser:
    dataType: string
    value: "processio"
    targets:
      - refVar: POSTGRES_USER
        services:
          - process-io-db
  processIoDbPw:
    dataType: string
    value: "processio"
    targets:
      - refVar: POSTGRES_PASSWORD
        services:
          - process-io-db
  processIoDbDataV2:
    dataType: string
    value: "/var/lib/postgresql/data/pgdata"
    targets:
      - refVar: PGDATA
        services:
          - process-io-db
