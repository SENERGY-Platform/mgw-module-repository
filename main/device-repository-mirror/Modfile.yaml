modfileVersion: "v1"
id: github.com/SENERGY-Platform/mgw-device-repository-mirror-module
name: Device-Repository Mirror Module
version: v1.5.0
type: add-on
deploymentType: single
license: "Apache License 2.0"
services:
  device-repo-mirror-db:
    name: device-repo-mirror-db
    image: mongo:4.1.11
  device-repo-mirror:
    name: device-repo-mirror
    image: ghcr.io/senergy-platform/device-repository:v3.4.0
    requiredServices:
      - device-repo-mirror-db
dependencies:
  github.com/SENERGY-Platform/mgw-cloud-proxy/mgw-module:
    version: "<v1.0.0"
    requiredServices:
      gateway:
        - refVar: MGW_MIRROR_SOURCE_URL
          template: "http://{ref}/device-repository"
          services:
            - device-repo-mirror
        - refVar: MGW_CERT_MANAGER_URL
          template: "http://{ref}:8080/api"
          services:
            - device-repo-mirror
serviceReferences:
  device-repo-mirror-db:
    - refVar: MONGO_URL
      template: "mongodb://{ref}:27017"
      services:
        - device-repo-mirror
volumes:
  device-repo-mirror-db-volume:
    - mountPoint: /data/db
      services:
        - device-repo-mirror-db
configs:
  asMgwMirror:
    dataType: string
    value: "true"
    targets:
      - refVar: AS_MGW_MIRROR
        services:
          - device-repo-mirror
  mirrorUpdateInterval:
    dataType: string
    value: "10m"
    targets:
      - refVar: MGW_MIRROR_UPDATE_INTERVAL
        services:
          - device-repo-mirror
    userInput:
      type: text
      name: Mirror Update Interval
  mirrorMissPullTimeout:
    dataType: string
    value: "10s"
    targets:
      - refVar: MGW_MIRROR_MISS_PULL_TIMEOUT
        services:
          - device-repo-mirror
    userInput:
      type: text
      description: "max wait for the pull a 404 on a mirror GET triggers, defaults to 10s"
      name: Mirror Miss Pull Timeout
  mirrorMissPullBackoff:
    dataType: string
    value: "10s"
    targets:
      - refVar: MGW_MIRROR_MISS_PULL_BACKOFF
        services:
          - device-repo-mirror
    userInput:
      type: text
      description: "wait before the same GET may pull again after its pull found nothing, defaults to 10s"
      name: Mirror Miss Pull Backoff
  mirrorMissPullMaxBackoff:
    dataType: string
    value: "5m"
    targets:
      - refVar: MGW_MIRROR_MISS_PULL_MAX_BACKOFF
        services:
          - device-repo-mirror
    userInput:
      type: text
      description: "the backoff doubles per miss up to this value, defaults to 5m"
      name: Mirror Miss Pull Max Backoff
  mongoDatabase:
    dataType: string
    value: "devicerepository"
    targets:
      - refVar: MONGO_DATABASE
        services:
          - device-repo-mirror
  debug:
    dataType: string
    value: "false"
    options:
      - "true"
      - "false"
    optionsExt: false
    targets:
      - refVar: DEBUG
        services:
          - device-repo-mirror
    userInput:
      type: text
      name: DEBUG
